name: Autograding

on:
  push:
    branches: [main]
    paths: ['.grade/result.json']

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.actor == 'ics2-grader[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Report score
        run: |
          export POINTS=$(jq -r '.points' .grade/result.json)
          export MAX=$(jq -r '.max' .grade/result.json)
          SUMMARY_B64=$(jq -r '.summary // empty' .grade/result.json)

          RESULT=$(python3 -c "
          import json, base64, os
          pts = int(os.environ['POINTS'])
          mx = int(os.environ['MAX'])
          r = {
            'version': 1,
            'status': 'pass' if pts == mx else 'fail',
            'max_score': mx,
            'tests': [{
              'name': 'Lab1 Autograding',
              'status': 'pass' if pts == mx else 'fail',
              'score': pts,
              'max_score': mx,
              'message': f'{pts}/{mx}',
              'test_code': '',
              'filename': '',
              'line_no': 0,
              'duration': 0
            }]
          }
          print(base64.b64encode(json.dumps(r).encode()).decode())
          ")
          echo "GRADE_RESULTS=$RESULT" >> "$GITHUB_ENV"

          if [ -n "$SUMMARY_B64" ]; then
            echo "$SUMMARY_B64" | base64 -d >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          GRADE_RESULTS: ${{ env.GRADE_RESULTS }}
        with:
          runners: grade
