name: Autograding

on:
  push:
    branches: [main]
    paths: ['.grade/result.json']

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.actor == 'ics2-grader[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Report score
        run: |
          POINTS=$(jq -r '.points' .grade/result.json)
          MAX=$(jq -r '.max' .grade/result.json)
          SUMMARY_B64=$(jq -r '.summary // empty' .grade/result.json)

          echo "::notice title=Autograding complete::Points ${POINTS}/${MAX}"
          echo "::notice title=Autograding report::{\"totalPoints\":${POINTS},\"maxPoints\":${MAX}}"

          if [ -n "$SUMMARY_B64" ]; then
            echo "$SUMMARY_B64" | base64 -d >> "$GITHUB_STEP_SUMMARY"
          fi
