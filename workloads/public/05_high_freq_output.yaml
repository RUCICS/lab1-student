name: "High frequency output stress"
id: t_high_freq_output
category: stress
timeout_sec: 15
terminal:
  rows: 24
  cols: 80
steps:
  - action: start
  - action: create_pane_with_probe
  - action: wait_probe_ready
    pane: 0
  - action: create_session
  - action: wait
    duration_ms: 300
  - action: send_keys
    pane: 1
    keys: "seq 1 10000"
  - action: send_keys
    pane: 1
    keys: "Enter"
  - action: wait
    duration_ms: 2000
  - action: verify_env_check
    pane: 0
  - action: wait
    duration_ms: 500
  - action: verify_output_token
    pane: 0
